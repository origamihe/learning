server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: learning-platform

  # Profiles
  profiles:
    active: dev

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/learning_platform
    username: postgres
    password: Pass1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# MinIO 配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: user1

# JWT 配置
jwt:
  secret: /lN1r8XXB3nRtifaQcPj1nJn9+Y8T+E6+hJ8QCgi1zy8QjmAe6icJe9fy7oWwNNaF5rdzAg/BoicdKLHrZ9O9Q==
  expiration: 86400000     # 24小时 (毫秒)
  refresh-expiration: 604800000  # 7天

# 应用自定义配置
app:
  frontend-url: http://localhost:5173
  default-avatar: http://localhost:9000/learning-platform/default-avatar.png
  sign-in-points: 5
  max-streak-bonus: 20

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-enums-package: io.github.origamihe.learning.enums
  type-handlers-package: io.github.origamihe.learning.handler
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Logging
logging:
  level:
    com.learning: INFO
    org.springframework.web: INFO
    io.github.origamihe.learning.mapper: DEBUG

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true